<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paprika Pay</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 16px;
    }

    #reader {
      width: 100%;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #28a745;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<h2>Paprika Pay</h2>

<div id="reader"></div>

<div id="transaction" class="card" style="display:none">
  <h3 id="merchant"></h3>
  <p id="amount"></p>

  <button onclick="pay()">
    Bayar
  </button>
</div>

<script>

const API_BASE =
  "https://yin-voting-goes.ngrok-free.dev/v1";

let currentTransaction = null;
let html5QrCode = null;

async function resolveQr(qrPayload) {

  console.log("QR Payload:", qrPayload);

  const response = await fetch(
    `${API_BASE}/transactions/resolve`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        qr_payload: qrPayload
      })
    }
  );

  const text = await response.text();

  console.log(
    "resolve",
    response.status,
    text
  );

  if (!response.ok) {
    throw new Error(text);
  }

  return JSON.parse(text);
}

async function pay() {

  if (!currentTransaction) {
    alert("Tidak ada transaksi");
    return;
  }

  console.log(
    "PAY TXN:",
    currentTransaction
  );

  const response = await fetch(
    `${API_BASE}/_dev/trigger-payment`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        transaction_id: currentTransaction.id
      })
    }
  );

  const text = await response.text();

  console.log(
    "trigger-payment",
    response.status,
    text
  );

  if (response.ok) {

    alert("Pembayaran berhasil");

  } else {

    alert(
      `Pembayaran gagal\n\n${text}`
    );
  }
}

async function onScanSuccess(decodedText) {

  try {

    if (html5QrCode) {
      await html5QrCode.stop();
    }

    const trx =
      await resolveQr(decodedText);

    console.log(
      "Resolved transaction:",
      trx
    );

    currentTransaction = trx;

    document.getElementById("merchant").innerText =
      trx.merchant_id ?? "-";

    document.getElementById("amount").innerText =
      "Rp " +
      Number(trx.amount)
        .toLocaleString("id-ID");

    document.getElementById("transaction")
      .style.display = "block";

  } catch (e) {

    console.error(e);

    alert(
      "QR tidak dikenali\n\n" +
      e.message
    );

    startScanner();
  }
}

function onScanFailure(error) {
  // abaikan
}

async function startScanner() {

  html5QrCode =
    new Html5Qrcode("reader");

  try {

    await html5QrCode.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: 250
      },
      onScanSuccess,
      onScanFailure
    );

  } catch (e) {

    console.log(
      "Environment camera gagal"
    );

    try {

      const devices =
        await Html5Qrcode.getCameras();

      if (
        !devices ||
        devices.length === 0
      ) {
        throw new Error(
          "Kamera tidak ditemukan"
        );
      }

      let cameraId =
        devices[0].id;

      const rearCamera =
        devices.find(device => {

          const label =
            device.label.toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          );
        });

      if (rearCamera) {
        cameraId =
          rearCamera.id;
      }

      await html5QrCode.start(
        cameraId,
        {
          fps: 10,
          qrbox: 250
        },
        onScanSuccess,
        onScanFailure
      );

    } catch (err) {

      console.error(err);

      alert(
        "Tidak dapat mengakses kamera"
      );
    }
  }
}

startScanner();

</script>
</body>
</html>
